name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without leading "v"), e.g. 0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JVM native libs. One job per (OS, arch) classifier. Each builds
  # libharfbuzz_jni for its slice and uploads the resources/native/<classifier>/
  # subtree (lib + .sha256) for the publish job to consume.
  # ─────────────────────────────────────────────────────────────────────────
  build-jvm-native:
    name: jvm native (${{ matrix.classifier }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (native)
            classifier: macos-aarch64
            gradleArgs: ""
          - os: macos-latest        # Apple Silicon, cross-compile to Intel
            classifier: macos-x86_64
            gradleArgs: "-PnativeArch=x86_64"
          - os: ubuntu-latest
            classifier: linux-x86_64
            gradleArgs: ""
          - os: windows-latest
            classifier: windows-x86_64
            gradleArgs: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build JVM native lib
        run: ./gradlew :harfbuzz-core:writeNativeJvmSha ${{ matrix.gradleArgs }} --no-daemon --stacktrace

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.classifier }}
          path: harfbuzz-core/src/jvmMain/resources/native/${{ matrix.classifier }}/
          retention-days: 14
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Publish to Maven Central. Runs on macOS so iOS framework publications
  # build cleanly (xcrun + CMake for HarfBuzz iOS static libs, cinterop).
  # Pulls each platform's prebuilt JNI lib from the matrix above and skips
  # the local CMake step via -PskipNativeBuild.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: publish to Maven Central
    needs: build-jvm-native
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # tag form: v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Konan + Kotlin/Native cache. iOS publication compiles the cinterop'd
      # bindings + HarfbuzzCore framework, so the toolchain has to be present.
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches/kotlin-native
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v3

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: harfbuzz-core/src/jvmMain/resources/native
          pattern: native-*

      # download-artifact lays artifacts out as
      # `resources/native/native-<classifier>/<file>`. Flatten so the runtime
      # NativeLoader sees `native/<classifier>/<file>`.
      - name: Reorganize native artifacts
        run: |
          set -eux
          cd harfbuzz-core/src/jvmMain/resources/native
          for d in native-*; do
            classifier="${d#native-}"
            mkdir -p "$classifier"
            mv "$d"/* "$classifier/"
            rmdir "$d"
          done
          find . -type f

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          ./gradlew \
            -Pversion="${{ steps.version.outputs.version }}" \
            -PskipNativeBuild \
            publishAndReleaseToMavenCentral \
            --no-daemon --stacktrace --no-configuration-cache

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
